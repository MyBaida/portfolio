<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#eaf6fb" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0e2a3a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ambient blobs -->
  <circle cx="120" cy="120" r="90" fill="url(#sky)" opacity="0.12"/>
  <circle cx="410" cy="380" r="110" fill="url(#mint)" opacity="0.14"/>

  <!-- floating ring -->
  <circle cx="400" cy="120" r="34" stroke="url(#sky)" stroke-width="6" opacity="0.5"/>
  <rect x="70" y="360" width="54" height="54" rx="16" stroke="url(#mint)" stroke-width="6" opacity="0.5" transform="rotate(12 97 387)"/>

  <!-- code window -->
  <g filter="url(#soft)">
    <rect x="120" y="150" width="290" height="210" rx="22" fill="url(#glass)"/>
  </g>
  <rect x="120" y="150" width="290" height="40" rx="22" fill="#ffffff" opacity="0.6"/>
  <circle cx="146" cy="170" r="6" fill="#f87171"/>
  <circle cx="166" cy="170" r="6" fill="#fbbf24"/>
  <circle cx="186" cy="170" r="6" fill="#34d399"/>

  <!-- code lines -->
  <rect x="146" y="210" width="60" height="10" rx="5" fill="url(#sky)"/>
  <rect x="214" y="210" width="120" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="146" y="234" width="40" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="194" y="234" width="150" height="10" rx="5" fill="url(#mint)"/>
  <rect x="164" y="258" width="90" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="262" y="258" width="60" height="10" rx="5" fill="url(#sky)" opacity="0.7"/>
  <rect x="164" y="282" width="130" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="146" y="306" width="70" height="10" rx="5" fill="url(#mint)" opacity="0.8"/>
  <rect x="224" y="306" width="90" height="10" rx="5" fill="#cbd5e1"/>

  <!-- avatar bubble -->
  <g filter="url(#soft)">
    <circle cx="255" cy="410" r="52" fill="url(#glass)"/>
  </g>
  <circle cx="255" cy="398" r="20" fill="url(#sky)"/>
  <path d="M223 438c6-20 18-28 32-28s26 8 32 28z" fill="url(#mint)"/>

  <!-- sparkles -->
  <path d="M430 240l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="url(#sky)" opacity="0.7"/>
  <path d="M90 240l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="url(#mint)" opacity="0.7"/>
</svg>
